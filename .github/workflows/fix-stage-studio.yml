# Fix & verify Staging Supabase Studio (:3010 + https://db-stage.ndmcore.com).
# Does not touch production ERP :3001 or production Supabase.
name: Fix staging Studio (db-stage)

on:
  push:
    branches:
      - cursor/fix-stage-studio-traefik-e9d2
    paths:
      - 'scripts/fix-stage-studio-vps.sh'
      - 'deploy/supabase-stage-traefik.yml'
      - '.github/workflows/fix-stage-studio.yml'
  workflow_dispatch:

jobs:
  fix-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        id: sshkey
        env:
          VPS_KEY_MAIN: ${{ secrets.VPS_SSH_KEY }}
          VPS_KEY_ALT: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="${VPS_KEY_MAIN:-}"; [ -z "$KEY" ] && KEY="${VPS_KEY_ALT:-}"
          [ -n "$KEY" ] || { echo "::error::VPS_SSH_KEY missing"; exit 1; }
          KEYFILE="${RUNNER_TEMP}/fix-studio.pem"
          printf '%s\n' "$KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh-keygen -y -f "$KEYFILE" >/dev/null
          echo "keyfile=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Run Studio fix/verify on VPS
        env:
          KEYFILE: ${{ steps.sshkey.outputs.keyfile }}
        run: |
          set -euo pipefail
          HOST=72.62.254.176
          mkdir -p "${RUNNER_TEMP}/ssh"
          KNOWN="${RUNNER_TEMP}/ssh/known_hosts"
          ssh-keyscan -T 10 -p 22 "$HOST" >> "$KNOWN" 2>/dev/null || true

          ssh -i "$KEYFILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN" -o ConnectTimeout=30 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=10 \
            root@"$HOST" "mkdir -p /root/NEWPOSV3/scripts /root/NEWPOSV3/deploy"

          scp -i "$KEYFILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN" \
            scripts/fix-stage-studio-vps.sh \
            root@"$HOST":/root/NEWPOSV3/scripts/fix-stage-studio-vps.sh

          scp -i "$KEYFILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN" \
            deploy/supabase-stage-traefik.yml \
            root@"$HOST":/root/NEWPOSV3/deploy/supabase-stage-traefik.yml

          ssh -i "$KEYFILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN" -o ConnectTimeout=30 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=10 \
            root@"$HOST" \
            "chmod +x /root/NEWPOSV3/scripts/fix-stage-studio-vps.sh && bash /root/NEWPOSV3/scripts/fix-stage-studio-vps.sh"

      - name: External smoke from runner
        run: |
          set -euo pipefail
          CODE="$(curl -skS -o /dev/null -w '%{http_code}' -I --connect-timeout 15 https://db-stage.ndmcore.com/)"
          FOLLOW="$(curl -skS -o /dev/null -w '%{http_code}' -L --connect-timeout 15 https://db-stage.ndmcore.com/)"
          echo "runner https://db-stage.ndmcore.com/ → $CODE (follow $FOLLOW)"
          [[ "$CODE" =~ ^(200|301|302|307|308)$ ]]
          [[ "$FOLLOW" == "200" ]]
          BODY="$(curl -skS --connect-timeout 15 https://db-stage.ndmcore.com/project/default | head -c 200)"
          echo "$BODY" | grep -qi 'supabase\|html' 
          echo "EXTERNAL: OK — https://db-stage.ndmcore.com loads without SSH tunnel"

      - name: Cleanup key
        if: always()
        run: rm -f "${{ steps.sshkey.outputs.keyfile }}"
