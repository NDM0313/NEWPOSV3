# Recover / recreate erp-frontend-preview on VPS :3002 from existing image.
# No docker build (avoids SSH cancel during long builds). No prod touch.
name: Deploy preview frontend (:3002)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: recreate (image only) or rebuild (full compose build)
        required: true
        default: recreate
        type: choice
        options:
          - recreate
          - rebuild
      branch:
        description: Branch for rebuild mode (ignored for recreate)
        required: false
        default: cursor/preview-3002-verify-runbook-e9d2
  push:
    branches:
      - cursor/preview-3002-verify-runbook-e9d2
    paths:
      - '.github/workflows/deploy-preview-frontend.yml'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare SSH key
        id: sshkey
        env:
          VPS_KEY_MAIN: ${{ secrets.VPS_SSH_KEY }}
          VPS_KEY_ALT: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="${VPS_KEY_MAIN:-}"
          if [ -z "$KEY" ]; then KEY="${VPS_KEY_ALT:-}"; fi
          if [ -z "$KEY" ]; then
            echo "::error::Add repository secret VPS_SSH_KEY"
            exit 1
          fi
          KEYFILE="${RUNNER_TEMP}/vps_preview.pem"
          printf '%s\n' "$KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh-keygen -y -f "$KEYFILE" > /dev/null
          echo "keyfile=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Recreate preview container on :3002
        env:
          KEYFILE: ${{ steps.sshkey.outputs.keyfile }}
          MODE: ${{ github.event.inputs.mode || 'recreate' }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'cursor/preview-3002-verify-runbook-e9d2' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ssh"
          KNOWN="${RUNNER_TEMP}/ssh/known_hosts"
          ssh-keyscan -T 10 -p 22 72.62.254.176 >> "$KNOWN" 2>/dev/null || true

          ssh -i "$KEYFILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=60 \
            -p 22 \
            root@72.62.254.176 \
            "export MODE='${MODE}' BRANCH='${DEPLOY_BRANCH}'; bash -s" <<'REMOTE'
          set -euo pipefail
          echo "[preview] mode=$MODE branch=${BRANCH:-}"

          recreate() {
            docker image inspect erp-frontend-preview:latest >/dev/null
            docker rm -f erp-frontend-preview 2>/dev/null || true
            docker network create erp-preview_net 2>/dev/null || true
            docker run -d \
              --name erp-frontend-preview \
              --restart unless-stopped \
              --network erp-preview_net \
              -p 3002:80 \
              erp-frontend-preview:latest
          }

          if [ "${MODE}" = "rebuild" ]; then
            cd /root/NEWPOSV3-preview-qa
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            BRANCH="$BRANCH" DEPLOY_DIR=/root/NEWPOSV3-preview-qa COMPOSE_PROJECT_NAME=erp-preview \
              bash scripts/deploy-preview-frontend-vps.sh
          else
            recreate
          fi

          docker ps --filter name=erp-frontend --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}'
          curl -sI http://127.0.0.1:3002/ | head -5
          curl -sI http://127.0.0.1:3002/m/ | head -5
          docker exec erp-frontend-preview sh -c 'grep -rl erp_sidebar_open /usr/share/nginx/html/assets | head -3'
          echo "[preview] READY"
          REMOTE

      - name: Cleanup key
        if: always()
        run: rm -f "${{ steps.sshkey.outputs.keyfile }}"
