# Rebuild erp-frontend-preview on VPS :3002 only (no migrations / no prod erp-frontend).
#
# Requires repository secret: VPS_SSH_KEY (same as deploy-vps.yml)
# Manual only — avoid auto-redeploy loops on every push to the feature branch.
name: Deploy preview frontend (:3002)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy to preview worktree
        required: true
        default: cursor/preview-3002-verify-runbook-e9d2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare SSH key
        id: sshkey
        env:
          VPS_KEY_MAIN: ${{ secrets.VPS_SSH_KEY }}
          VPS_KEY_ALT: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="${VPS_KEY_MAIN:-}"
          if [ -z "$KEY" ]; then KEY="${VPS_KEY_ALT:-}"; fi
          if [ -z "$KEY" ]; then
            echo "::error::Add repository secret VPS_SSH_KEY"
            exit 1
          fi
          KEYFILE="${RUNNER_TEMP}/vps_preview.pem"
          printf '%s\n' "$KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh-keygen -y -f "$KEYFILE" > /dev/null
          echo "keyfile=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Deploy preview on :3002
        env:
          KEYFILE: ${{ steps.sshkey.outputs.keyfile }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ssh"
          KNOWN="${RUNNER_TEMP}/ssh/known_hosts"
          ssh-keyscan -T 10 -p 22 72.62.254.176 >> "$KNOWN" 2>/dev/null || true

          ssh -i "$KEYFILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=60 \
            -p 22 \
            root@72.62.254.176 \
            "export BRANCH='${DEPLOY_BRANCH}' COMPOSE_PROJECT_NAME=erp-preview; bash -s" <<'REMOTE'
          set -euo pipefail
          export BRANCH="${BRANCH}"
          export DEPLOY_DIR=/root/NEWPOSV3-preview-qa
          export COMPOSE_PROJECT_NAME=erp-preview
          BRANCH="$BRANCH" DEPLOY_DIR="$DEPLOY_DIR" COMPOSE_PROJECT_NAME=erp-preview \
            bash -c 'cd /root/NEWPOSV3-preview-qa && git fetch origin "$BRANCH" && git checkout -B "$BRANCH" "origin/$BRANCH" && bash scripts/deploy-preview-frontend-vps.sh'
          docker ps --filter name=erp-frontend --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}'
          curl -sI http://127.0.0.1:3002/ | head -5
          curl -sI http://127.0.0.1:3002/m/ | head -5
          docker exec erp-frontend-preview sh -c 'grep -rl erp_sidebar_open /usr/share/nginx/html/assets | head -3'
          REMOTE

      - name: Cleanup key
        if: always()
        run: rm -f "${{ steps.sshkey.outputs.keyfile }}"
