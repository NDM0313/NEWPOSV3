# Build Android debug APK for erp-mobile-app and upload as a downloadable artifact.
name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/preview-3002-verify-runbook-e9d2
      - main
    paths:
      - 'erp-mobile-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: erp-mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp-mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true
        working-directory: ${{ github.workspace }}

      - name: Write production env (locked api.ndmcore.com)
        env:
          ANON_FROM_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VPS_KEY_MAIN: ${{ secrets.VPS_SSH_KEY }}
          VPS_KEY_ALT: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ANON="${ANON_FROM_SECRET:-}"
          if [ -z "$ANON" ]; then
            KEY="${VPS_KEY_MAIN:-${VPS_KEY_ALT:-}}"
            if [ -n "$KEY" ]; then
              KEYFILE="${RUNNER_TEMP}/vps_apk.pem"
              printf '%s\n' "$KEY" > "$KEYFILE"
              chmod 600 "$KEYFILE"
              mkdir -p "${RUNNER_TEMP}/ssh"
              KNOWN="${RUNNER_TEMP}/ssh/known_hosts"
              ssh-keyscan -T 10 -p 22 72.62.254.176 >> "$KNOWN" 2>/dev/null || true
              ANON=$(ssh -i "$KEYFILE" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$KNOWN" \
                -o ConnectTimeout=30 \
                -p 22 \
                root@72.62.254.176 \
                "grep -E '^ANON_KEY=' /root/supabase/docker/.env 2>/dev/null | head -1 | cut -d= -f2- || grep -E '^VITE_SUPABASE_ANON_KEY=' /root/NEWPOSV3/.env.production 2>/dev/null | head -1 | cut -d= -f2-")
              rm -f "$KEYFILE"
            fi
          fi
          if [ -z "${ANON:-}" ] || [ "${#ANON}" -lt 120 ]; then
            echo "::error::Missing VITE_SUPABASE_ANON_KEY (repo secret) or VPS ANON_KEY"
            exit 1
          fi
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=https://api.ndmcore.com
          VITE_SUPABASE_ANON_KEY=${ANON}
          VITE_TARGET=capacitor
          EOF
          sed -i 's/^[[:space:]]*//' .env.production
          echo "Wrote .env.production (URL=https://api.ndmcore.com, anon_len=${#ANON})"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:mobile || npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: erp-mobile-app/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          APK=$(find erp-mobile-app/android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-mobile-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
