# Staging Supabase Kong + Studio (isolated from production supabase.yml)
# Hosts: api-stage.ndmcore.com → stage Kong ; db-stage.ndmcore.com → stage Studio
# Requires: dokploy-traefik attached to stage-supabase-net (see wire script).
http:
  middlewares:
    stage-studio-storage-policy:
      headers:
        customResponseHeaders:
          Permissions-Policy: "storage-access=(self)"
    stage-supabase-cors:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3002"
          - "http://127.0.0.1:3002"
          - "http://localhost:5173"
          - "https://api-stage.ndmcore.com"
          - "https://db-stage.ndmcore.com"
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS
          - PUT
          - PATCH
          - DELETE
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true
    stage-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true
  routers:
    api-stage-ndmcore:
      rule: Host(`api-stage.ndmcore.com`)
      service: stage-supabase-kong
      middlewares:
        - stage-supabase-cors
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    api-stage-ndmcore-http:
      rule: Host(`api-stage.ndmcore.com`)
      middlewares:
        - stage-redirect-https
      service: stage-supabase-kong
      entryPoints:
        - web
    db-stage-ndmcore:
      rule: Host(`db-stage.ndmcore.com`)
      service: stage-supabase-studio
      middlewares:
        - stage-studio-storage-policy
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    db-stage-ndmcore-http:
      rule: Host(`db-stage.ndmcore.com`)
      middlewares:
        - stage-redirect-https
      service: stage-supabase-studio
      entryPoints:
        - web
  services:
    stage-supabase-kong:
      loadBalancer:
        servers:
          - url: http://stage-supabase-kong:8000
        passHostHeader: true
    stage-supabase-studio:
      loadBalancer:
        servers:
          - url: http://stage-supabase-studio:3000
        passHostHeader: true
